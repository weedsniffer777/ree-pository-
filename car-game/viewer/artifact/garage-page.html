<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasteland Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D stage; a compact instrument panel floats top-left (bottom drawer on phones). */
  :root {
    --panel: rgba(246, 242, 234, 0.92);
    --panel-edge: #cfc6b4;
    --ink: #24272b;
    --ink-soft: #6a6f76;
    --chip: #e9e3d6;
    --chip-edge: #cfc6b4;
    --hazard: #e0b52a;
    --hazard-ink: #17181a;
    --stage: #e5dcc5;
    --font-display: 'Chakra Petch', 'Arial Narrow', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(24, 26, 29, 0.9); --panel-edge: #3a3e44; --ink: #e6e3dc; --ink-soft: #9ba0a7;
      --chip: #2a2d32; --chip-edge: #41454c; --hazard: #e0b52a; --hazard-ink: #17181a; --stage: #1b1d20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(24, 26, 29, 0.9); --panel-edge: #3a3e44; --ink: #e6e3dc; --ink-soft: #9ba0a7;
    --chip: #2a2d32; --chip-edge: #41454c; --hazard: #e0b52a; --hazard-ink: #17181a; --stage: #1b1d20;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--stage); color: var(--ink); font: 13px/1.4 var(--font-body); }
  #app { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: 236px;
    max-height: calc(100% - 32px); overflow-y: auto;
    padding: 12px 14px 14px; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 6px; display: flex; flex-direction: column; gap: 12px;
    backdrop-filter: blur(6px);
  }
  #panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #panel h1 {
    margin: 0; font: 600 15px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  #panel h1::before {
    content: ''; width: 18px; height: 10px; border-radius: 2px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 4px, var(--hazard-ink) 4px 8px);
  }
  #collapse { display: none; }
  #panel section { display: flex; flex-direction: column; gap: 6px; }
  #panel .label { font: 500 10.5px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); }
  #panel button, #panel select {
    background: var(--chip); color: var(--ink); border: 1px solid var(--chip-edge); border-radius: 4px;
    padding: 5px 8px; font: 500 12px/1.1 var(--font-body); cursor: pointer;
  }
  #panel select { width: 100%; }
  #panel button:hover { border-color: var(--ink-soft); }
  #panel button:focus-visible, #panel select:focus-visible { outline: 2px solid var(--hazard); outline-offset: 1px; }
  #panel button.active { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard); }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  #stats { font: 500 12px/1.3 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink-soft); letter-spacing: 0.03em; }
  .hint { color: var(--ink-soft); font-size: 11.5px; }
  .sock-label { font: 10px/1 ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, 0.65); padding: 2px 4px; border-radius: 3px; }
  body.noui #panel, body.noui .sock-label { display: none; }

  @media (max-width: 600px) {
    #panel {
      top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; width: auto;
      max-height: 46%;
    }
    #collapse { display: inline-block; }
    #panel.collapsed section { display: none; }
  }
</style>

<div id="app"></div>
<div id="panel">
  <header>
    <h1>Wasteland Garage</h1>
    <button id="collapse" type="button" aria-expanded="true">Hide</button>
  </header>
  <section><span class="label">Model</span><select id="model" aria-label="Model"></select></section>
  <section><span class="label">Camera</span><div class="row" id="views"></div></section>
  <section><span class="label">Ground</span><div class="row" id="grounds"></div></section>
  <section><span class="label">Show</span><div class="row" id="toggles"></div></section>
  <section><span class="label">Stats</span><div id="stats">Building model…</div></section>
  <section><span class="hint">Drag to orbit, scroll or pinch to zoom, right-drag to pan.</span></section>
</div>
<script>
  (function () {
    var b = document.getElementById('collapse');
    var p = document.getElementById('panel');
    b.addEventListener('click', function () {
      var c = p.classList.toggle('collapsed');
      b.textContent = c ? 'Show' : 'Hide';
      b.setAttribute('aria-expanded', String(!c));
    });
  })();
</script>
<script type="module" src="viewer.js"></script>

</html>
